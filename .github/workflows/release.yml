name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manual release tag
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Decode upload keystore
        if: env.SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace --no-configuration-cache lintRelease testReleaseUnitTest assembleRelease bundleRelease cyclonedxBom

      - name: Prepare release assets
        if: env.SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/FlashPlay.apk
          cp app/build/outputs/bundle/release/*.aab release-assets/FlashPlay.aab
          cp app/build/outputs/mapping/release/mapping.txt release-assets/mapping.txt
          find build/reports -name 'bom.json' -exec cp {} release-assets/sbom.cdx.json \; -quit
          test -s release-assets/sbom.cdx.json
          (cd release-assets && sha256sum FlashPlay.apk FlashPlay.aab mapping.txt sbom.cdx.json > SHA256SUMS.txt)

      - name: Verify APK signature
        if: env.SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs release-assets/FlashPlay.apk

      - name: Attest APK and AAB
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/FlashPlay.apk
            release-assets/FlashPlay.aab

      - name: Attest release SBOM
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/FlashPlay.apk
            release-assets/FlashPlay.aab
          sbom-path: release-assets/sbom.cdx.json

      - name: Upload release assets
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*

      - name: Remove keystore
        if: always() && env.SIGNING_CONFIGURED == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Report missing release signing
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          echo "### Release assets not built" >> "$GITHUB_STEP_SUMMARY"
          echo "Configure all Android signing secrets in the protected release environment, then rebuild the existing tag with workflow_dispatch." >> "$GITHUB_STEP_SUMMARY"
